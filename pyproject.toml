[project]
name = "llm-inference-perf-engine"
version = "0.1.0"
description = "私有化大模型推理网关与流式性能工程系统"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = ["ruff"]

[project.scripts]
llmp = "llmp.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 128
exclude = ["docs", ".venv"]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "RUF",
]
ignore = ["D", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
lines-between-types = 0
no-lines-before = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "I001"]
