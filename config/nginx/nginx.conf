# Nginx 智能网关
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 限流区域定义
    limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # 负载均衡上游 - Ollama 推理后端
    upstream llm_backend {
        server m_ollama:11434 weight=1 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # 负载均衡上游 - Open WebUI 前端网页
    upstream webui_backend {
        server m_webui:8080;
    }

    server {
        listen 80;
        server_name localhost;

        charset utf-8;
        access_log /var/log/nginx/llm_access.log;
        error_log /var/log/nginx/llm_error.log warn;

        # 默认路由转发给 Open WebUI
        location / {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;

            # 支持 WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 流式聊天补全接口, 分流给 Ollama 后端
        location /v1/chat/completions {
            proxy_pass http://llm_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # SSE 流式传输, 禁用代理缓冲区, 实现 Token 毫秒级流式穿透
            proxy_buffering off;
            proxy_cache off;

            # 超时设置
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            keepalive_timeout 65s;

            # 分块传输与网络层低延迟优化
            chunked_transfer_encoding on;
            tcp_nopush off;
            tcp_nodelay on;

            # 网关层前置限流
            limit_req zone=llm_limit burst=5 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ollama 推理生成接口(核心端点)
        location /api/generate {
            proxy_pass http://llm_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # SSE 流式传输, 禁用代理缓冲区, 实现 Token 毫秒级流式穿透
            proxy_buffering off;
            proxy_cache off;

            # 超时设置
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            keepalive_timeout 65s;

            # 分块传输与网络层低延迟优化
            chunked_transfer_encoding on;
            tcp_nopush off;
            tcp_nodelay on;

            # 网关层前置限流
            limit_req zone=llm_limit burst=5 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 模型列表查询接口, 分流给 Ollama 后端
        location /api/tags {
            proxy_pass http://llm_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            limit_req zone=api_limit burst=10 nodelay;
        }

        # 健康检查端点
        location /health {
            proxy_pass http://llm_backend;
            proxy_http_version 1.1;

            proxy_read_timeout 10s;
            proxy_send_timeout 10s;

            proxy_no_cache 1;
            proxy_cache_bypass 1;
            access_log off;
        }
    }
}
