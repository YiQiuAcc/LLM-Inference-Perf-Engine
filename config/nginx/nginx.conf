# Nginx 智能网关配置 - 针对大模型 SSE 流式传输

# 限流区域定义
limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# 负载均衡上游推理集群
upstream llm_backend {
    # Ollama 推理节点
    server 192.168.1.10:11434 weight=1 max_fails=2 fail_timeout=10s;
    # vLLM 推理节点（预留）
    server 192.168.1.11:8000 weight=2 max_fails=2 fail_timeout=10s;

    # 保持网关与推理后端的 HTTP 心跳长连接
    keepalive 32;
}

server {
    listen 80;
    server_name llm.enterprise.local;

    # 全局字符集与日志
    charset utf-8;
    access_log /var/log/nginx/llm_access.log;
    error_log /var/log/nginx/llm_error.log warn;

    # 流式聊天补全
    location /v1/chat/completions {
        proxy_pass http://llm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE 流式传输, 禁用代理缓冲区Token 毫秒级穿透
        proxy_buffering off;
        proxy_cache off;

        # 超时设置：适配长文本/深思考模型（如 DeepSeek-R1）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        keepalive_timeout 65s;

        # 分块传输与网络层低延迟优化
        chunked_transfer_encoding on;
        tcp_nopush off;
        tcp_nodelay on;

        # 网关层前置限流：防止突发并发冲垮后端显存
        limit_req zone=llm_limit burst=5 nodelay;

        # 安全头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 模型列表查询接口
    location /api/tags {
        proxy_pass http://llm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=api_limit burst=10 nodelay;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://llm_backend;
        proxy_http_version 1.1;

        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # 健康检查不缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        access_log off;
    }

    # 静态资源与默认路由
    location / {
        return 404;
    }
}

