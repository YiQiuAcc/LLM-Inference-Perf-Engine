# Prometheus 告警规则
# 定义硬件层与推理引擎层的异常检测与告警触发条件

groups:
  # GPU 硬件层告警规则
  - name: gpu_hardware_alerts
    interval: 30s
    rules:
      # GPU 显存过载告警
      - alert: GPUMemoryHigh
        expr: |
          DCGM_FI_DEV_GPU_UTIL > 0
          and
          (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) * 100 > 90
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "GPU 显存使用率超过 90%(当前: {{ $value | humanizePercentage }})"
          description: "实例 {{ $labels.instance }} 的 GPU 显存使用率已达 {{ $value | humanizePercentage }}持续超过 30 秒有 CUDA OOM 风险请及时排查。"

      # GPU 温度过高告警
      - alert: GPUTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 82
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "GPU 温度超过 82°C(当前: {{ $value }}°C)"
          description: "实例 {{ $labels.instance }} 的 GPU 温度已达 {{ $value }}°C持续超过 30 秒存在硬件降频或损坏风险。"

      # GPU 掉线/不可达告警
      - alert: GPUInstanceDown
        expr: up{job="dcgm_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU 指标采集实例 {{ $labels.instance }} 离线"
          description: "DCGM Exporter 实例 {{ $labels.instance }} 已离线超过 1 分钟GPU 硬件监控信号丢失。"

  # 推理引擎层告警规则
  # 当前后端为 Ollama, 启用前需先在 prometheus.yml 中取消 ollama job 的注释
  - name: inference_engine_alerts
    interval: 30s
    rules:
      # 推理引擎离线告警 — 需先启用 prometheus.yml 中的 ollama scrape job
      - alert: InferenceEngineDown
        expr: up{job="ollama"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "推理引擎实例 {{ $labels.instance }} 离线"
          description: "Ollama 推理引擎实例 {{ $labels.instance }} 已离线超过 1 分钟推理服务中断。"

  # vLLM 特定告警规则(预留 — 切换到 vLLM 后端时启用)
