  #       annotations:
  #         summary: '推理请求 P95 延迟超过 30 秒(当前: {{ $value }}s)'
  #         description: '推理请求 P95 延迟已达 {{ $value }}s持续 2 分钟用户体验显著下降。'

  # 基础设施层告警规则
  - name: infrastructure_alerts
    interval: 30s
    rules:
      # Prometheus 自身健康
      - alert: PrometheusTargetMissing
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus 服务离线"
          description: "Prometheus 监控服务已离线超过 1 分钟全链路可观测性中断。"

